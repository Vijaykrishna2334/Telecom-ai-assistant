<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telecom AI Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
    }

    /* Header */
    .header {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 1rem 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      font-size: 2rem;
    }

    .logo h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .logo p {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
    }

    .nav-tab {
      padding: 10px 24px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .nav-tab:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .nav-tab.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    /* Main Container */
    .main-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    /* Container Base */
    .container-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .container-header {
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status-dot.disconnected {
      background: #f87171;
    }

    .status-dot.connecting {
      background: #fbbf24;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    /* Chat Section */
    .chat-messages {
      height: 400px;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .message.assistant .message-avatar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .message.user .message-avatar {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .message-content {
      max-width: 70%;
      padding: 12px 18px;
      border-radius: 18px;
      line-height: 1.5;
    }

    .message.assistant .message-content {
      background: rgba(255, 255, 255, 0.1);
      border-bottom-left-radius: 4px;
    }

    .message.user .message-content {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-bottom-right-radius: 4px;
    }

    .message-time {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
    }

    /* Input Area */
    .input-container {
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 12px;
    }

    .chat-input {
      flex: 1;
      padding: 14px 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .chat-input:focus {
      border-color: #667eea;
      background: rgba(255, 255, 255, 0.15);
    }

    .chat-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Voice Button */
    .btn-voice {
      width: 50px;
      height: 50px;
      padding: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
    }

    .btn-voice.recording {
      animation: recordPulse 1s infinite;
      background: #ef4444;
    }

    @keyframes recordPulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      }

      50% {
        box-shadow: 0 0 0 15px rgba(239, 68, 68, 0);
      }
    }

    /* Voice Tab */
    .voice-container {
      display: none;
    }

    .voice-container.active {
      display: block;
    }

    .voice-interface {
      text-align: center;
      padding: 3rem 2rem;
    }

    .voice-status {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: rgba(255, 255, 255, 0.8);
    }

    .voice-state {
      padding: 8px 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }

    .voice-state.listening {
      background: rgba(74, 222, 128, 0.2);
      color: #4ade80;
    }

    .voice-state.processing {
      background: rgba(251, 191, 36, 0.2);
      color: #fbbf24;
    }

    .voice-state.speaking {
      background: rgba(102, 126, 234, 0.2);
      color: #667eea;
    }

    .voice-btn-large {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      cursor: pointer;
      font-size: 3.5rem;
      color: #fff;
      transition: all 0.3s ease;
      box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
      margin: 1rem 0;
    }

    .voice-btn-large:hover {
      transform: scale(1.05);
    }

    .voice-btn-large.active {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      animation: recordPulse 1s infinite;
    }

    .voice-btn-large:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .voice-visualizer {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin: 2rem 0;
    }

    .visualizer-bar {
      width: 4px;
      background: linear-gradient(180deg, #667eea, #764ba2);
      border-radius: 2px;
      transition: height 0.1s ease;
    }

    .conversation-log {
      margin-top: 2rem;
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      text-align: left;
      max-height: 200px;
      overflow-y: auto;
    }

    .conversation-log h3 {
      margin-bottom: 1rem;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
    }

    .log-entry {
      margin: 12px 0;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .log-entry.user {
      background: rgba(240, 147, 251, 0.1);
      border-left: 3px solid #f093fb;
    }

    .log-entry.assistant {
      background: rgba(102, 126, 234, 0.1);
      border-left: 3px solid #667eea;
    }

    .log-entry strong {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 4px;
    }

    .log-entry.user strong {
      color: #f093fb;
    }

    .log-entry.assistant strong {
      color: #667eea;
    }

    /* Loading */
    .loading-dots {
      display: inline-flex;
      gap: 4px;
    }

    .loading-dots span {
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: loadingDot 1.4s infinite;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .loading-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes loadingDot {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
    }

    /* Hidden */
    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <span class="logo-icon">📞</span>
        <div>
          <h1>Telecom AI Assistant</h1>
          <p>Your intelligent support companion</p>
        </div>
      </div>
      <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('chat')">💬 Chat</button>
        <button class="nav-tab" onclick="switchTab('voice')">🎤 Voice</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="main-container">
    <!-- Chat Container -->
    <div class="container-box" id="chatContainer">
      <div class="container-header">
        <div class="status-dot" id="chatStatus"></div>
        <span>Chat with AI Assistant</span>
      </div>

      <div class="chat-messages" id="chatMessages"></div>

      <div class="input-container">
        <input type="text" class="chat-input" id="chatInput" placeholder="Type your message..."
          onkeypress="handleKeyPress(event)">
        <button class="btn btn-primary" onclick="sendMessage()" id="sendBtn">Send</button>
      </div>
    </div>

    <!-- Voice Container -->
    <div class="container-box voice-container" id="voiceContainer">
      <div class="container-header">
        <div class="status-dot" id="voiceStatus"></div>
        <span>Real-Time Voice Assistant</span>
        <span id="wsStatus"
          style="margin-left: auto; font-size: 0.8rem; color: rgba(255,255,255,0.5);">Disconnected</span>
      </div>

      <div class="voice-interface">
        <p class="voice-status" id="voiceStatusText">Click the microphone to start listening</p>
        <div class="voice-state" id="voiceState">Ready</div>
        <p style="font-size: 0.85rem; color: rgba(255,255,255,0.5); margin-bottom: 1rem;">
          🔄 Continuous mode: Just speak naturally, it auto-detects when you pause
        </p>

        <button class="voice-btn-large" onclick="toggleVoice()" id="voiceBtnLarge">🎤</button>

        <div class="voice-visualizer" id="visualizer">
          <!-- Bars will be generated by JS -->
        </div>

        <div class="conversation-log">
          <h3>💬 Conversation</h3>
          <div id="conversationLog">
            <p style="color: rgba(255,255,255,0.4); font-size: 0.9rem;">Start speaking to begin...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==================== Configuration ====================
    const API_URL = 'http://localhost:8080/api/v1';
    const WS_URL = 'ws://localhost:8080';

    // ==================== State ====================
    let sessionId = 'session_' + Date.now();
    let chatHistory = []; // Track conversation history
    let voiceWs = null;
    let isVoiceActive = false;
    let audioContext = null;
    let mediaStream = null;
    let processor = null;
    let audioQueue = [];
    let isPlaying = false;
    let currentAudioSource = null; // Track current playing audio for barge-in
    let playbackAudioContext = null; // Track playback audio context

    // ==================== Initialization ====================
    document.addEventListener('DOMContentLoaded', () => {
      initChat();
      initVisualizer();
    });

    function initChat() {
      const welcomeMsg = 'Namaste! I am your Jio Support Assistant. How can I help you today? You can ask me about plans, billing, network issues, or anything else related to your telecom service.';
      addMessage('assistant', welcomeMsg);
      // Initialize history with welcome message
      chatHistory.push({ role: 'assistant', content: welcomeMsg });
    }

    function initVisualizer() {
      const visualizer = document.getElementById('visualizer');
      for (let i = 0; i < 20; i++) {
        const bar = document.createElement('div');
        bar.className = 'visualizer-bar';
        bar.style.height = '10px';
        visualizer.appendChild(bar);
      }
    }

    // ==================== Tab Switching ====================
    function switchTab(tab) {
      const tabs = document.querySelectorAll('.nav-tab');
      tabs.forEach(t => t.classList.remove('active'));

      // If event exists (click), use currentTarget
      if (window.event && window.event.currentTarget) {
        window.event.currentTarget.classList.add('active');
      } else {
        // Fallback search
        const searchText = tab.charAt(0).toUpperCase() + tab.slice(1);
        tabs.forEach(t => { if (t.innerText.includes(searchText)) t.classList.add('active'); });
      }

      const chatContainer = document.getElementById('chatContainer');
      const voiceContainer = document.getElementById('voiceContainer');

      if (tab === 'chat') {
        chatContainer.classList.remove('hidden');
        voiceContainer.classList.remove('active');
        if (voiceWs) disconnectVoice();
      } else {
        chatContainer.classList.add('hidden');
        voiceContainer.classList.add('active');
      }
    }

    // ==================== Chat Functions ====================
    function addMessage(role, content) {
      const container = document.getElementById('chatMessages');
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      container.insertAdjacentHTML('beforeend', `
                <div class="message ${role}">
                    <div class="message-avatar">${role === 'assistant' ? '🤖' : '👤'}</div>
                    <div>
                        <div class="message-content">${content}</div>
                        <div class="message-time">${time}</div>
                    </div>
                </div>
            `);

      // Smooth scroll to bottom
      setTimeout(() => {
        container.scrollTo({
          top: container.scrollHeight,
          behavior: 'smooth'
        });
      }, 100);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!message) return;

      addMessage('user', message);
      input.value = '';
      input.disabled = true;
      document.getElementById('sendBtn').disabled = true;

      // Loading indicator
      const container = document.getElementById('chatMessages');
      container.insertAdjacentHTML('beforeend', `
                <div class="message assistant" id="loadingMsg">
                    <div class="message-avatar">🤖</div>
                    <div class="message-content"><div class="loading-dots"><span></span><span></span><span></span></div></div>
                </div>
            `);
      container.scrollTop = container.scrollHeight;

      try {
        const response = await fetch(`${API_URL}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message,
            session_id: sessionId,
            history: chatHistory
          })
        });

        const data = await response.json();
        document.getElementById('loadingMsg')?.remove();

        if (data.session_id) sessionId = data.session_id;
        const assistantMsg = data.message || 'Sorry, I could not process your request.';
        addMessage('assistant', assistantMsg);

        // Update history
        chatHistory.push({ role: 'user', content: message });
        chatHistory.push({ role: 'assistant', content: assistantMsg });

        // Limit history
        if (chatHistory.length > 10) chatHistory = chatHistory.slice(-10);

      } catch (error) {
        document.getElementById('loadingMsg')?.remove();
        addMessage('assistant', 'Error connecting to server. Please make sure the backend is running.');
      }

      input.disabled = false;
      document.getElementById('sendBtn').disabled = false;
      input.focus();
    }

    // ==================== Voice Functions ====================
    async function toggleVoice() {
      if (!isVoiceActive) {
        await startVoice();
      } else {
        stopVoice();
      }
    }

    async function startVoice() {
      try {
        // Connect WebSocket
        voiceWs = new WebSocket(`${WS_URL}/ws/voice/realtime/${sessionId}`);

        voiceWs.onopen = async () => {
          updateVoiceUI('connected');
          await startAudioCapture();
        };

        voiceWs.onmessage = handleVoiceMessage;
        voiceWs.onerror = (e) => { console.error('WebSocket error:', e); updateVoiceUI('error'); };
        voiceWs.onclose = () => { updateVoiceUI('disconnected'); isVoiceActive = false; };

      } catch (error) {
        console.error('Voice start error:', error);
        updateVoiceUI('error');
      }
    }

    async function startAudioCapture() {
      try {
        audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });

        const source = audioContext.createMediaStreamSource(mediaStream);
        processor = audioContext.createScriptProcessor(512, 1, 1);

        processor.onaudioprocess = (e) => {
          if (voiceWs && voiceWs.readyState === WebSocket.OPEN) {
            const inputData = e.inputBuffer.getChannelData(0);
            const buffer = new ArrayBuffer(inputData.length * 2);
            const view = new Int16Array(buffer);

            for (let i = 0; i < inputData.length; i++) {
              view[i] = Math.max(-32768, Math.min(32767, inputData[i] * 32768));
            }

            voiceWs.send(buffer);
            updateVisualizer(inputData);
          }
        };

        source.connect(processor);
        processor.connect(audioContext.destination);

        isVoiceActive = true;
        document.getElementById('voiceBtnLarge').classList.add('active');

      } catch (error) {
        console.error('Audio capture error:', error);
        alert('Could not access microphone. Please allow microphone permission.');
      }
    }

    function stopVoice() {
      // Stop all audio playback FIRST
      stopAllAudio();

      // Send disconnect message to backend
      if (voiceWs && voiceWs.readyState === WebSocket.OPEN) {
        voiceWs.send(JSON.stringify({ type: 'disconnect' }));
      }

      if (processor) processor.disconnect();
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      if (audioContext) audioContext.close();
      if (voiceWs) voiceWs.close();

      isVoiceActive = false;
      document.getElementById('voiceBtnLarge').classList.remove('active');
      updateVoiceUI('disconnected');
    }

    function disconnectVoice() {
      stopVoice();
    }

    function handleVoiceMessage(event) {
      if (event.data instanceof Blob) {
        // Audio data
        playAudio(event.data);
      } else {
        // JSON message
        const data = JSON.parse(event.data);
        handleVoiceEvent(data);
      }
    }

    function handleVoiceEvent(data) {
      switch (data.type) {
        case 'connected':
          console.log('Voice connected:', data.message);
          break;

        case 'speech_start':
          updateVoiceState('listening', 'Listening...');
          break;

        case 'speech_end':
          updateVoiceState('processing', 'Processing...');
          break;

        case 'transcript':
          addToConversationLog('user', data.text);
          break;

        case 'token':
          // Real-time token display (optional)
          break;

        case 'response_complete':
          addToConversationLog('assistant', data.text);
          break;

        case 'audio_start':
          updateVoiceState('speaking', 'Speaking...');
          break;

        case 'audio_end':
          // Audio chunk finished
          break;

        case 'stop_audio':
          // Barge-in detected - stop ALL audio immediately
          stopAllAudio();
          updateVoiceState('listening', '⚡ Interrupted - Listening...');
          console.log('Barge-in: All audio stopped');
          break;

        case 'error':
          console.error('Voice error:', data.message);
          updateVoiceState('ready', 'Error: ' + data.message);
          break;
      }
    }

    function updateVoiceState(state, text) {
      const stateEl = document.getElementById('voiceState');
      const statusEl = document.getElementById('voiceStatusText');

      stateEl.className = 'voice-state ' + state;
      stateEl.textContent = text || state.charAt(0).toUpperCase() + state.slice(1);

      if (statusEl && text) statusEl.textContent = text;
    }

    function updateVoiceUI(status) {
      const statusDot = document.getElementById('voiceStatus');
      const wsStatus = document.getElementById('wsStatus');

      statusDot.className = 'status-dot';

      switch (status) {
        case 'connected':
          wsStatus.textContent = 'Connected';
          updateVoiceState('listening', '🎧 Listening... speak anytime');
          break;
        case 'disconnected':
          statusDot.classList.add('disconnected');
          wsStatus.textContent = 'Disconnected';
          updateVoiceState('ready', 'Click mic to start');
          break;
        case 'error':
          statusDot.classList.add('disconnected');
          wsStatus.textContent = 'Error';
          break;
      }
    }

    function addToConversationLog(role, text) {
      const log = document.getElementById('conversationLog');
      if (log.querySelector('p')) log.innerHTML = ''; // Clear placeholder

      log.insertAdjacentHTML('beforeend', `
                <div class="log-entry ${role}">
                    <strong>${role === 'user' ? '👤 You' : '🤖 Assistant'}</strong>
                    ${text}
                </div>
            `);

      // Smooth scroll to bottom - scroll the PARENT container which is scrollable
      setTimeout(() => {
        const scrollableContainer = log.parentElement; // .conversation-log div
        scrollableContainer.scrollTo({
          top: scrollableContainer.scrollHeight,
          behavior: 'smooth'
        });
      }, 200);
    }

    function updateVisualizer(audioData) {
      const bars = document.querySelectorAll('.visualizer-bar');
      const step = Math.floor(audioData.length / bars.length);

      bars.forEach((bar, i) => {
        const value = Math.abs(audioData[i * step] || 0);
        const height = Math.max(5, value * 100);
        bar.style.height = `${height}px`;
      });
    }


    function stopAllAudio() {
      // Stop current audio source
      if (currentAudioSource) {
        try {
          currentAudioSource.stop();
        } catch (e) {
          console.log('Audio source already stopped');
        }
        currentAudioSource = null;
      }

      // Close playback audio context
      if (playbackAudioContext) {
        playbackAudioContext.close();
        playbackAudioContext = null;
      }

      // Clear queue and reset state
      audioQueue = [];
      isPlaying = false;
      console.log('All audio stopped and cleared');
    }

    async function playAudio(blob) {
      audioQueue.push(blob);
      if (!isPlaying) playNextAudio();
    }

    async function playNextAudio() {
      if (audioQueue.length === 0) {
        isPlaying = false;
        updateVoiceState('listening', 'Listening...');
        return;
      }

      isPlaying = true;
      const blob = audioQueue.shift();

      try {
        // Reuse or create playback audio context
        if (!playbackAudioContext || playbackAudioContext.state === 'closed') {
          playbackAudioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        const arrayBuffer = await blob.arrayBuffer();
        const audioBuffer = await playbackAudioContext.decodeAudioData(arrayBuffer);

        const source = playbackAudioContext.createBufferSource();
        currentAudioSource = source; // Track for barge-in
        source.buffer = audioBuffer;
        source.connect(playbackAudioContext.destination);
        source.onended = () => {
          currentAudioSource = null;
          playNextAudio();
        };
        source.start();
      } catch (error) {
        console.error('Audio playback error:', error);
        currentAudioSource = null;
        playNextAudio();
      }
    }
  </script>
