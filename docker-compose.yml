version: '3.8'

# MINIMAL docker-compose - Only essential services
# PostgreSQL and Redis are OPTIONAL and not included here

services:
  # Ollama LLM Server (REQUIRED)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Backend (REQUIRED)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEBUG=false
      - LOG_LEVEL=INFO
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./knowledge:/app/knowledge
      - chroma_data:/app/chroma_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # React Frontend (REQUIRED)
  frontend:
    build:
      context: ./telecom-voice-companion-main
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  ollama_data:
  chroma_data:

networks:
  default:
    name: telecom_ai_network
